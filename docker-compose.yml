services:
  nomad-api:
    build:
      context: ./backend
    container_name: nomad-api
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  nomad-web:
    build:
      context: .
      args:
        NOMAD_API_INTERNAL_URL: http://nomad-api:8000
    container_name: nomad-web
    ports:
      - "3000:3000"
    depends_on:
      - nomad-api
    restart: unless-stopped
